<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="signup-page">
        <div class="signup-bg">
            <div class="signup-card">

                <h1 class="signup-title">Sign Up</h1>

                <div class="signup-form">

                    <input type="text" class="signup-field" placeholder="First name">
                    <input type="text" class="signup-field" placeholder="Last name">
                    <input type="email" class="signup-field" placeholder="E-mail">
                    <input type="tel" class="signup-field" placeholder="Phone">

                    <p class="signup-hint">
                        Your password is 8-20 characters,<br>
                        includes one letter and one number
                    </p>

                    <div class="signup-passrow">
                        <span class="signup-lockicon">🔒</span>
                        <input type="password" class="signup-field" placeholder="Password">
                        <span class="signup-eyeicon">👁</span>
                    </div>

                    <div class="signup-passrow">
                        <span class="signup-lockicon">🔒</span>
                        <input type="password" class="signup-field" placeholder="Confirm password">
                        <span class="signup-eyeicon">👁</span>
                    </div>

                    <div class="signup-checkrow">
                        <input type="checkbox" class="signup-checkbox" id="signup-terms">
                        <label class="signup-checklabel" for="signup-terms">
                            I agree to the terms of service and privacy policy. By creating an account, you agree to our terms of service and privacy policy. Please read them carefully before proceeding.
                            <a href="#" class="signup-checklink">Terms of Service &amp; Privacy Policy</a>
                        </label>
                    </div>

                    <a href="welcome-page.html" class="signup-btnprimary">Create an Account</a>

                </div>

                <div class="signup-bottomtext">
                    Already have an account?
                    <a href="sign-in.html" class="signup-signinlink">Sign In</a>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
