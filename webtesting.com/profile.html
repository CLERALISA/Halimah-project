<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />

    <link href="all-images\icon-images\icon.png" rel="shortcut icon" type="image-png" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <title>NIITITCORE | Sign UP</title>
</head>

<body>

    



    <section class="auth-section">
        <div class="auth-background">


            <div class="overlay-bg">
                <div class="profile-container">
                    <div class="profile-wrapper">
                      <div class="alert-success">
              👋 <span class="alert-highlight">Hi</span> <span class="alert-highlight">Halimah</span>, Welcome to your profile.
             </div>
                        <div class="profile-detail">
                            <h3>Full Name:</h3>
                            <span id="textFullName"></span>
                        </div>

                         <div class="profile-detail">
                           <h3>Email Address:</h3>
                             <span id="textEmailAddress"></span>
                        </div>

                         <div class="profile-detail">
                            <h3>Phone Number:</h3>
                            <span id="textPhoneNumber"> </span>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </section>
<script >
     const userData = JSON.parse(sessionStorage.getItem('userSignUpSession'));
     document.getElementById('textFullName').innerHTML= userData.data.fullName;
     document.getElementById('textEmailAddress').innerHTML= userData.data.emailAddress;
     document.getElementById('textPhoneNumber').innerHTML= userData.data.phoneNumber;
    </script>
</body>

</html>
