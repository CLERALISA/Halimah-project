<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http: //www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="ROBOTS" content="ALL" />
    <meta name="Engine" content="all" />
    <meta name="distribution" content="global" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta property="og:type" content="Website" />
    <link href="styles/icons-1.11.3/font/bootstrap-icons.css" type="text/css" rel="stylesheet" />
    <link href="styles/contants.css" type="text/css" rel="stylesheet" />
    <link href="styles/main.css" type="text/css" rel="stylesheet" />
    <title>LEEMAH | My first authentication project</title>
</head>

<body>

    <section class="login-page-session">
        <div class="background-img">
            <div class="form-container">
                <div class="form-wrapper">
                    <h1>LEEMAH</h1>

                    <div class="top-btn-wrapper">
                        <a href="index.html"> <button class="btn login-btn" title="Login">Login</button></a>
                        <a href="register.html"><button class="btn" title="Register">Register</button></a>
                        <a href="forgot-password.html"><button class="btn forgot-password-btn" title="Forgot Password">Forgot Password</button></a>
                    </div>

                    <div class="form-content">
                        <p>Create An  Account</p>

                        <input type="text" class="text-field" name="name" id="name" placeholder="Name" />
                        <input type="text" class="text-field" name="email" id="email" placeholder="Email" />
                        <input type="password" class="text-field" name="password" id="password"
                            placeholder="********" />

                        <div class="bottom-btn-wrapper">
                         <button class="login-btn" title="Register">Register</button>
                        </div>

                        <div class="social-container">
                            <p>Or Login With</p>
                            <div class="social-icon-wrapper">
                                <div class="social-icon facebook" title="Facebook">
                                    <i class="bi bi-facebook"></i>
                                </div>
                                <div class="social-icon twitter" title="Twitter">
                                    <i class="bi bi-twitter"></i>
                                </div>
                                <div class="social-icon google" title="Google">
                                    <i class="bi bi-google"></i>
                                </div>
                                <div class="social-icon linkedin" title="LinkedIn">
                                    <i class="bi bi-linkedin"></i>
                                </div>
                                <div class="social-icon pinterest" title="Pinterest">
                                    <i class="bi bi-pinterest"></i>
                                </div>
                
                            </div>
                        </div>

                    </div>





                </div>
            </div>

        </div>


    </section>


</body>

</html>
