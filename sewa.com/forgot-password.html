<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | PetroCore Energy</title>
    <link rel="stylesheet" href="/styles/contants.css">
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>

    <div class="forgot-password-container">

        <div class="forgot-password-content">

            <a href="welcome-page.html" class="forgot-password-logo">
                PETRO<span>CORE</span>
            </a>

            <div class="forgot-password-icon">
                ?
            </div>

            <p class="forgot-password-subtitle">
                ACCOUNT RECOVERY
            </p>

            <h1>Forgot Password?</h1>

            <p class="forgot-password-description">
                Don't worry. Enter the email address associated
                with your account and we'll help you reset your password.
            </p>

            <form class="forgot-password-form">

                <div class="forgot-password-form-group">
                    <label for="forgot-email">Email Address</label>

                    <input
                        type="email"
                        id="forgot-email"
                        placeholder="Enter your email address"
                        required>
                </div>

                <button type="submit" class="forgot-password-button">
                    Send Reset Link
                </button>

            </form>

            <a href="index.html" class="forgot-password-back">
                ← Back to Sign In
            </a>

        </div>

    </div>

</body>

</html>
