<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PetroCore Energy</title>
    <link rel="stylesheet" href="/styles/contants.css">
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>

    <div class="signin-container">

        <div class="signin-content">

            <div class="signin-brand">
                <a href="welcome-page.html" class="signin-logo">
                    PETRO<span>CORE</span>
                </a>

                <p>Powering today. Energizing tomorrow.</p>
            </div>

            <div class="signin-form-section">

                <p class="signin-subtitle">WELCOME BACK</p>

                <h1>Sign In</h1>

                <p class="signin-description">
                    Sign in to access your PetroCore Energy account.
                </p>

                <form class="signin-form">

                    <div class="signin-form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="Enter your email address" required>
                    </div>

                    <div class="signin-form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>

                    <div class="signin-form-options">

                        <label class="signin-remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="forgot-password.html">
                            Forgot Password?
                        </a>

                    </div>

                    <button type="submit" class="signin-button">
                        Sign In
                    </button>

                </form>

                <p class="signin-register">
                    Don't have an account?
                    <a href="sign-up.html">Create Account</a>
                </p>

                <a href="homepage.html" class="signin-home-link">
                    ← Back to Homepage
                </a>

            </div>

        </div>

    </div>

</body>

</html>
