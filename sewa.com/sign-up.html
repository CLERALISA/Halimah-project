<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | PetroCore Energy</title>
    <link rel="stylesheet" href="/styles/contants.css">
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>

    <div class="signup-container">

        <div class="signup-content">

            <div class="signup-brand">
                <a href="welcome-page.html" class="signup-logo">
                    PETRO<span>CORE</span>
                </a>

                <h2>Join PetroCore Energy</h2>

                <p>
                    Create an account and stay connected with our
                    energy solutions and services.
                </p>
            </div>

            <div class="signup-form-section">

                <p class="signup-subtitle">CREATE ACCOUNT</p>

                <h1>Sign Up</h1>

                <form class="signup-form">

                    <div class="signup-form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" placeholder="Enter your full name" required>
                    </div>

                    <div class="signup-form-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" placeholder="Enter your email address" required>
                    </div>

                    <div class="signup-form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" placeholder="Enter your phone number" required>
                    </div>

                    <div class="signup-form-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a password" required>
                    </div>

                    <div class="signup-form-group">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" placeholder="Confirm your password" required>
                    </div>

                    <button type="submit" class="signup-button">
                        Create Account
                    </button>

                </form>

                <p class="signup-login">
                    Already have an account?
                    <a href="sign-in.html">Sign In</a>
                </p>

                <a href="homepage.html" class="signup-home-link">
                    ← Back to Homepage
                </a>

            </div>

        </div>

    </div>

</body>

</html>
