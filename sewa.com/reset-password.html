<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | PetroCore Energy</title>
    <link rel="stylesheet" href="/styles/contants.css">
    <link rel="stylesheet" href="/styles/main.css">
</head>

<body>

    <div class="reset-password-container">

        <div class="reset-password-content">

            <a href="welcome-page.html" class="reset-password-logo">
                PETRO<span>CORE</span>
            </a>

            <p class="reset-password-subtitle">
                ACCOUNT SECURITY
            </p>

            <h1>Reset Your Password</h1>

            <p class="reset-password-description">
                Create a new password for your PetroCore Energy account.
            </p>

            <form class="reset-password-form">

                <div class="reset-password-form-group">
                    <label for="new-password">New Password</label>

                    <input
                        type="password"
                        id="new-password"
                        placeholder="Enter your new password"
                        required>
                </div>

                <div class="reset-password-form-group">
                    <label for="reset-confirm-password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="reset-confirm-password"
                        placeholder="Confirm your new password"
                        required>
                </div>

                <button type="submit" class="reset-password-button">
                    Reset Password
                </button>

            </form>

            <a href="sign-in.html" class="reset-password-back">
                ← Back to Sign In
            </a>

        </div>

    </div>

</body>

</html>
