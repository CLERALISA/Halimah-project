<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayHub</title>
    <link rel="stylesheet" href="styles/main.css">

    <script src="JS/api.js"></script>
    <script src="JS/auth.js"></script>
</head>

<body>
    <div class="homepage-page">
        <div class="homepage-bg">
            <div class="homepage-grid">
                <div class="homepage-left">
                    <div class="homepage-signup-card">
                        <h1 class="homepage-signup-title">Sign Up</h1>
                        <div class="homepage-signup-form">

                            <input type="text" class="homepage-signup-field" placeholder="First name">
                            <input type="text" class="homepage-signup-field" placeholder="Last name">
                            <input type="email" class="homepage-signup-field" placeholder="E-mail">
                            <input type="tel" class="homepage-signup-field" placeholder="Phone">

                            <p class="homepage-signup-hint">
                                Your password is 8-20 characters,<br>
                                includes one letter and one number
                            </p>

                            <div class="homepage-signup-passrow">
                                <span class="homepage-signup-lockicon">🔒</span>
                                <input type="password" class="homepage-signup-field" placeholder="Password">
                                <span class="homepage-signup-eyeicon">👁</span>
                            </div>

                            <div class="homepage-signup-passrow">
                                <span class="homepage-signup-lockicon">🔒</span>
                                <input type="password" class="homepage-signup-field" placeholder="Confirm password">
                                <span class="homepage-signup-eyeicon">👁</span>
                            </div>

                            <div class="homepage-signup-checkrow">
                                <input type="checkbox" class="homepage-signup-checkbox" id="homepage-terms">
                                <label class="homepage-signup-checklabel" for="homepage-terms">
                                    I agree to the
                                    <a href="#" class="homepage-signup-checklink">Terms of Service &amp; Privacy
                                        Policy</a>
                                </label>
                            </div>

                            <a href="welcome-page.html" class="homepage-signup-btnprimary">Create an Account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
