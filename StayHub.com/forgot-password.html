<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayHub</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="forgot-page">
        <div class="forgot-bg">
            <div class="forgot-card">

                <h1 class="forgot-title">Account Recovery</h1>
                <p class="forgot-subtitle">
                    Enter your e-mail address below to reset your password
                </p>

                <div class="forgot-form">

                    <div class="forgot-fieldrow">
                        <span class="forgot-lefticon">✉</span>
                        <input type="email" class="forgot-field" placeholder="E-mail">
                    </div>

                    <div class="forgot-btnrow">
                        <a href="sign-in.html" class="forgot-btnsecondary">Back</a>
                        <a href="reset-password.html" class="forgot-btnprimary">Submit</a>
                    </div>

                </div>

                <div class="forgot-bottomtext">
                    Remember your password?
                    <a href="sign-in.html" class="forgot-signinlink">Sign In</a>
                </div>

            </div>
        </div>
    </div>
</body>
</html>
