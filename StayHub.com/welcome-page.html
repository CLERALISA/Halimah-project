<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayHub</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="welcome-page">
        <div class="welcome-bg">
            <div class="welcome-card">

                <div class="welcome-iconwrap">✅</div>

                <h1 class="welcome-title">Welcome!</h1>

                <div class="welcome-divider"></div>

                <p class="welcome-subtitle">
                    Your account has been verified successfully.
                    You are all set and ready to go!
                </p>

                <div class="welcome-infobox">

                    <div class="welcome-inforow">
                        <div class="welcome-infoicon">👤</div>
                        <div class="welcome-infotext">
                            <p class="welcome-infolabel">Account Status</p>
                            <span class="welcome-infovalue">Verified &amp; Active</span>
                        </div>
                    </div>

                    <div class="welcome-inforow">
                        <div class="welcome-infoicon">🔒</div>
                        <div class="welcome-infotext">
                            <p class="welcome-infolabel">Security</p>
                            <span class="welcome-infovalue">Protected</span>
                        </div>
                    </div>

                    <div class="welcome-inforow">
                        <div class="welcome-infoicon">📅</div>
                        <div class="welcome-infotext">
                            <p class="welcome-infolabel">Joined</p>
                            <span class="welcome-infovalue">Today</span>
                        </div>
                    </div>

                </div>

                <a href="home-page.html"
                   class="welcome-btnprimary">
                    Proceed to Your Page
                </a>

                <p class="welcome-bottomtext">
                    Not you?
                    <a href="sign-in.html" class="welcome-signinlink">Sign in with a different account</a>
                </p>

            </div>
        </div>
    </div>
</body>
</html>
